<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Overlay Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 { margin-top: 0; font-size: 1.5rem; color: #333; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .input-group {
            width: 100%;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #eee;
            margin-bottom: 20px;
            display: none; /* Hidden until image uploaded */
        }

        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover { background-color: #005bb5; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <!-- <h1>Notification Mocker</h1> -->

    <div class="controls">
        <div class="input-group">
            <label>1. Upload DM Screenshot (Background)</label>
            <input type="file" id="bgInput" accept="image/*">
        </div>
        
        <div class="input-group">
            <label>2. Upload Popup (Transparent PNG)</label>
            <input type="file" id="overlayInput" accept="image/*">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <button id="downloadBtn" disabled>Download Combined Image</button>
</div>

<script>
    const bgInput = document.getElementById('bgInput');
    const overlayInput = document.getElementById('overlayInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    let bgImg = new Image();
    let overlayImg = new Image();
    let bgLoaded = false;
    let overlayLoaded = false;

    // Handle Background Upload
    bgInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                bgImg.onload = () => {
                    bgLoaded = true;
                    drawCanvas();
                }
                bgImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // Handle Overlay Upload
    overlayInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                overlayImg.onload = () => {
                    overlayLoaded = true;
                    drawCanvas();
                }
                overlayImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // Draw Logic
    function drawCanvas() {
        if (!bgLoaded) return;

        // 1. Set canvas size to match background image
        canvas.width = bgImg.width;
        canvas.height = bgImg.height;

        // 2. Draw Background
        ctx.drawImage(bgImg, 0, 0);

        // 3. Draw Overlay (Centered) if loaded
        if (overlayLoaded) {
            const x = (canvas.width - overlayImg.width) / 2;
            const y = (canvas.height - overlayImg.height) / 2;
            ctx.drawImage(overlayImg, x, y);
        }

        // Show canvas and enable download
        canvas.style.display = 'block';
        downloadBtn.disabled = false;
    }

    // Download Logic
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'combined-image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
